[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src:%(here)s/migrations
path_separator = os
# The database URL comes from KHATA_DATABASE_URL_OWNER (see migrations/env.py);
# override per run with:  alembic -x db_url=postgresql+psycopg://... upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
